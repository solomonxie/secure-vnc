name: SecureVNC
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  SecureVNCKit:
    path: SecureVNCKit
targets:
  SecureVNC:
    type: application
    platform: iOS
    sources:
      - path: SecureVNC
        excludes:
          - "**/README.md"
    dependencies:
      - package: SecureVNCKit
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: SecureVNC
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Secure VNC
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlocks SSH keys that require Face ID."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to SSH servers on your local network."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
