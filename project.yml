name: SecureVNC
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  SecureVNCKit:
    path: SecureVNCKit
targets:
  SecureVNC:
    type: application
    platform: iOS
    sources:
      - path: SecureVNC
        excludes:
          - "**/README.md"
          - "Info.plist"
    info:
      path: SecureVNC/Info.plist
      properties:
        NSBonjourServices: ["_ssh._tcp", "_sftp-ssh._tcp", "_rfb._tcp", "_smb._tcp", "_afpovertcp._tcp", "_adisk._tcp", "_nfs._tcp", "_http._tcp", "_https._tcp", "_workstation._tcp", "_device-info._tcp", "_companion-link._tcp", "_apple-mobdev2._tcp", "_airplay._tcp", "_raop._tcp", "_mediaremotetv._tcp", "_homekit._tcp", "_hap._tcp", "_matter._tcp", "_ipp._tcp", "_ipps._tcp", "_printer._tcp", "_pdl-datastream._tcp", "_scanner._tcp", "_uscan._tcp", "_googlecast._tcp", "_androidtvremote2._tcp", "_amzn-wplay._tcp", "_spotify-connect._tcp", "_sonos._tcp", "_hue._tcp", "_home-assistant._tcp", "_esphomelib._tcp", "_daap._tcp"]
    dependencies:
      - package: SecureVNCKit
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: SecureVNC
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Secure VNC
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlocks SSH keys that require Face ID."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to SSH servers and finds devices on your local network."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
